# Android APK
#
# Packages the game into game.love and embeds it in a LÖVE for Android build.
# Commits that only touch docs or the art/ drawing boards don't trigger a build.
# Same shape as auto-chest's and demomino's, with two differences: the engine
# is patched (love-android-audio.patch, see below), and nothing pins the
# orientation -- the settings page's SCREEN row does that at run time.
#
# Outputs:
#   - every run: the signed APK as a workflow artifact, "Survive School"
#   - every run with the signing secrets set: the signed app bundle (.aab) for
#     Play Console as a second artifact, "Survive School (Play bundle)". Never
#     with the throwaway key: Play locks in the key of the first upload, so a
#     bundle signed with a key nobody kept must never reach it.
#   - tags v*:   a GitHub Release with the APK attached (what players download)
#
# Signing (repo Settings → Secrets and variables → Actions → Secrets):
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks / .keystore file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Android only installs an update over an existing app when the signing key
# (and application id) match. Without these secrets the APK is signed with a
# throwaway key and players must uninstall before installing each build.
#
# Optional repo variables (Settings → Secrets and variables → Actions → Variables):
#   ANDROID_APP_ID            application id (default com.cmatute.surviveschool)
#   ADMOB_APP_ID              AdMob app id (default: Google's sample app id)
#   ADMOB_REWARDED_ID         AdMob rewarded unit (default: Google's test unit)
# Leave the two AdMob ones unset and the APK can only ever show test ads.
#
# Purchases and ads (README **Ads and the shop**): love-iap's action adds Play
# Billing and its bridge, pinned to the commit src/iap.lua was vendored from;
# android/ads.sh adds the rewarded-ads bridge (android/love-ads), the Mobile Ads
# SDK and the consent SDK. Both land in love-android's lua-modules/.
#
# Launcher icon: the cool S (Sprites.COOLS) in ink on white, baked into
# love-android's res/ at build time by android/icon.py, so it follows the art.

name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - 'art/**'
      - '**.md'
      - '**.txt'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # LÖVE for Android revision (12.0 -- conf.lua names whichever engine runs it).
  # Pinned so builds are reproducible, the native build cache stays valid and
  # love-android-audio.patch keeps applying; bump on purpose, and the Patch
  # step fails loudly if the patch no longer fits.
  LOVE_ANDROID_REF: 4c65fff4f8b38693aca5d91bc06f254f86a97adf
  APP_NAME: Survive School
  APP_ID: ${{ vars.ANDROID_APP_ID || 'com.cmatute.surviveschool' }}
  APK_BASENAME: Survive School
  # Not a lock. At window creation SDL's setOrientationBis() re-requests an
  # orientation anyway, and with conf.lua's resizable window and no hint that is
  # FULL_USER -- which is src/orient.lua's AUTO. WIDE and TALL are set from the
  # settings page through the SDL_ORIENTATIONS hint. fullUser here only keeps
  # launch from forcing a side before that happens.
  APP_ORIENTATION: fullUser
  ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}
  ADMOB_REWARDED_ID: ${{ vars.ADMOB_REWARDED_ID || '' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # GitHub Release on v* tags
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
        with:
          path: game
          fetch-depth: 0   # tags for git describe

      - name: Version
        working-directory: game
        run: |
          # versionCode grows with every run so each APK installs over the last.
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$(git describe --tags --always | sed 's/^v//')" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # After setup-gradle on purpose: its wrapper validation would otherwise
      # trip on the unused sample wrapper JARs inside SDL's android-project.
      - name: Checkout LÖVE for Android
        uses: actions/checkout@v4
        with:
          repository: love2d/love-android
          ref: ${{ env.LOVE_ANDROID_REF }}
          path: love-android
          submodules: recursive

      # In-app purchases. Pinned to the commit src/iap.lua was copied from: the
      # Lua and the native bridge speak one protocol, so they move together.
      - name: Add in-app purchases (love-iap)
        uses: cmatuteortega/love-iap@6c881acd85a538d6fe59ce689bcca3a39ca26fc4
        with:
          love-android-path: love-android

      # Rewarded ads, and the consent form that has to come before them.
      - name: Add rewarded ads
        run: game/android/ads.sh love-android "$ADMOB_APP_ID" "$ADMOB_REWARDED_ID"

      # Music stops when the app goes to the background; see the patch for why
      # a game cannot do this from Lua.
      - name: Patch LÖVE
        working-directory: love-android/app/src/main/cpp/love
        run: git apply --verbose "$GITHUB_WORKSPACE/game/love-android-audio.patch"

      - name: Android NDK and CMake
        working-directory: love-android
        run: |
          ndk=$(sed -n "s/.*ndkVersion '\([^']*\)'.*/\1/p" app/build.gradle)
          echo "NDK $ndk"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" "cmake;3.22.1" > /dev/null

      # Native LÖVE build is the slow part; ccache makes rebuilds near-instant
      # when only the game (game.love) changed. The patch is part of the key so
      # a change to it is never served from a stale cache.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: love-android-${{ env.LOVE_ANDROID_REF }}-${{ hashFiles('game/love-android-audio.patch', 'game/android/love-ads/**') }}
          max-size: 2G

      - name: Configure LÖVE for Android
        working-directory: love-android
        run: |
          # App identity
          sed -i '/^app\.name_byte_array=/d; /^#\?app\.name=/d; /^app\.application_id=/d; /^app\.orientation=/d; /^app\.version_code=/d; /^app\.version_name=/d; /^org\.gradle\.jvmargs=/d' gradle.properties
          {
            # Gradle's own heap. love-android sets none, so it gets the 512 MB
            # default -- and merging the dex files of the ads and billing SDKs
            # for the APK and the bundle in one run runs out of it. The runner
            # has 16 GB.
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            echo "app.name=$APP_NAME"
            echo "app.application_id=$APP_ID"
            echo "app.orientation=$APP_ORIENTATION"
            echo "app.version_code=$VERSION_CODE"
            echo "app.version_name=$VERSION_NAME"
          } >> gradle.properties
          # Phones only (drop x86_64 emulator ABI) and compile through ccache
          sed -i "s/abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'/abiFilters 'armeabi-v7a', 'arm64-v8a'/" app/build.gradle
          sed -i 's/arguments "-DANDROID_STL=c++_shared",/arguments "-DANDROID_STL=c++_shared", "-DCMAKE_C_COMPILER_LAUNCHER=ccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",/' app/build.gradle
          grep -q 'CMAKE_CXX_COMPILER_LAUNCHER=ccache' app/build.gradle || { echo "::error::ccache patch did not apply to app/build.gradle"; exit 1; }
          grep -n '^app\.' gradle.properties
          # Cool S launcher icon (replaces the LÖVE heart)
          python3 ../game/android/icon.py app/src/main/res

      # Nothing reads art/ at run time (art/bake.lua bakes it into src/sprites.lua).
      - name: Package game.love
        working-directory: game
        run: |
          mkdir -p ../love-android/app/src/embed/assets
          zip -9 -r ../love-android/app/src/embed/assets/game.love main.lua conf.lua src -x '*.DS_Store'
          unzip -l ../love-android/app/src/embed/assets/game.love | grep -E ' (main|conf)\.lua$'
          ls -lh ../love-android/app/src/embed/assets/game.love

      # The APK to install directly and the bundle Play Console wants, from one
      # Gradle run so the native build is only done once.
      - name: Build APK and app bundle
        working-directory: love-android
        run: ./gradlew assembleEmbedNoRecordRelease bundleEmbedNoRecordRelease --stacktrace

      - name: Sign APK and app bundle
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          unsigned=$(ls love-android/app/build/outputs/apk/embedNoRecord/release/*.apk | head -1)
          echo "Unsigned APK: $unsigned"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          ks="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$ks"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a throwaway key. Players will have to uninstall before installing this APK."
            KEYSTORE_PASSWORD=android KEY_ALIAS=surviveschool KEY_PASSWORD=android
            keytool -genkeypair -keystore "$ks" -storepass android -keypass android \
              -alias surviveschool -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Survive School"
          fi
          export KEYSTORE_PASSWORD KEY_PASSWORD
          out="$RUNNER_TEMP/$APK_BASENAME.apk"
          "$bt/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$ks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "$out" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" verify --print-certs "$out"
          echo "APK=$out" >> "$GITHUB_ENV"

          # The bundle is signed with jarsigner (apksigner does not sign .aab),
          # and only with the real key -- see the note at the top of this file.
          if [ -n "$KEYSTORE_BASE64" ]; then
            bundle=$(ls love-android/app/build/outputs/bundle/embedNoRecordRelease/*.aab | head -1)
            echo "Unsigned bundle: $bundle"
            aab="$RUNNER_TEMP/$APK_BASENAME.aab"
            cp "$bundle" "$aab"
            jarsigner -keystore "$ks" -storepass:env KEYSTORE_PASSWORD \
              -keypass:env KEY_PASSWORD -sigalg SHA256withRSA -digestalg SHA-256 \
              "$aab" "$KEY_ALIAS"
            jarsigner -verify "$aab"
            keytool -printcert -jarfile "$aab" | grep -E 'SHA1:|SHA256:'
            echo "AAB=$aab" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets: skipping the Play bundle."
          fi
          rm -f "$ks"
        shell: bash

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME }}
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Upload app bundle
        if: env.AAB != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME }} (Play bundle)
          path: ${{ env.AAB }}
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          generate_release_notes: true
