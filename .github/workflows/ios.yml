# iOS app
#
# The iOS twin of android.yml: packages the game into game.love and builds it
# into LÖVE's own Xcode project (platform/xcode in the love source tree), on a
# macOS runner because nothing else can run Xcode. Triggered the same way.
#
# Same engine as the APK: LOVE_REF is the love commit love-android's pinned
# revision carries as its submodule, so both phones run the same 12.0. Bump the
# two together. love-android-audio.patch is not applied -- everything in it sits
# behind LOVE_ANDROID; iOS keeps running Lua on the way into the background, so
# the game's own love.focus / love.visible handling reaches the music there.
#
# Outputs:
#   - every run: "Survive School (iOS, unsigned)", an .ipa with no signature.
#     It installs nowhere as it is; sideloading tools (AltStore, Sideloadly)
#     re-sign it with the installer's own Apple ID, which is enough for a
#     phone on a desk. It is also proof the project compiles.
#   - every run with the signing secrets set: "Survive School (iOS)", signed
#     for the App Store, and uploaded to App Store Connect (TestFlight) as well
#     when the API key secrets are set too.
#   - tags v*: the unsigned .ipa attached to the GitHub Release android.yml
#     makes (the signed one only goes to Apple).
#
# Signing (repo Settings → Secrets and variables → Actions → Secrets), all from
# an Apple Developer account:
#   IOS_CERTIFICATE_P12_BASE64     base64 of an "Apple Distribution" certificate
#                                  exported with its private key as .p12
#   IOS_CERTIFICATE_PASSWORD       the .p12's password
#   IOS_PROVISIONING_PROFILE_BASE64  base64 of an App Store provisioning
#                                  profile for the app id below. The team and
#                                  the profile's name are read out of it.
# TestFlight upload, optional (App Store Connect → Users and Access →
# Integrations → App Store Connect API, a key with the App Manager role):
#   APP_STORE_CONNECT_KEY_ID
#   APP_STORE_CONNECT_ISSUER_ID
#   APP_STORE_CONNECT_KEY_P8       the .p8 file's contents
#
# Optional repo variable:
#   IOS_APP_ID      bundle id (default: ANDROID_APP_ID, else com.cmatute.surviveschool)
#
# Purchases: love-iap's StoreKit 2 bridge (ios/LoveIap.swift in that repo, at
# the same commit android.yml pins and src/iap.lua was vendored from) is
# compiled into the app by ios/configure.rb. The products need creating in App
# Store Connect under the same ids as on Play (src/store.lua). Ads have no iOS
# bridge: src/ads.lua says "no ads on iOS" and both offers stay inert there,
# as on a desktop.
#
# App icon: the cool S, baked by ios/appicon.py out of Sprites.COOLS.

name: iOS app

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - 'art/**'
      - '**.md'
      - '**.txt'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # love2d/love at the commit love-android's LOVE_ANDROID_REF has as its
  # app/src/main/cpp/love submodule (see the note at the top).
  LOVE_REF: 792690b73dc0c9f84c67c118e295cae1d04195b7
  # love2d/love-apple-dependencies: the last commit before LOVE_REF, so the
  # prebuilt SDL3 / LuaJIT / codecs are the ones that love commit built against.
  LOVE_DEPS_REF: a5522634f1e581a1ebab73bf3ab4bd7a853b7a3e
  # Must match the love-iap step in android.yml and src/iap.lua.
  LOVE_IAP_REF: 6c881acd85a538d6fe59ce689bcca3a39ca26fc4
  APP_NAME: Survive School
  APP_ID: ${{ vars.IOS_APP_ID || vars.ANDROID_APP_ID || 'com.cmatute.surviveschool' }}
  IPA_BASENAME: Survive School

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write   # GitHub Release on v* tags
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
        with:
          path: game
          fetch-depth: 0   # tags for the version

      - name: Version
        working-directory: game
        run: |
          # CFBundleVersion grows with every run, like the APK's versionCode:
          # App Store Connect refuses a second upload with the same one.
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          # CFBundleShortVersionString must be one to three dotted numbers, so
          # it is the last v* tag's and not git describe's "-3-gabc123" tail.
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          name=$(echo "${tag#v}" | grep -Eo '^[0-9]+(\.[0-9]+){0,2}' || true)
          echo "VERSION_NAME=${name:-1.0.0}" >> "$GITHUB_ENV"

      - name: Checkout LÖVE
        uses: actions/checkout@v4
        with:
          repository: love2d/love
          ref: ${{ env.LOVE_REF }}
          path: love

      - name: Checkout LÖVE's Apple dependencies
        uses: actions/checkout@v4
        with:
          repository: love2d/love-apple-dependencies
          ref: ${{ env.LOVE_DEPS_REF }}
          path: apple-dependencies

      - name: Checkout love-iap
        uses: actions/checkout@v4
        with:
          repository: cmatuteortega/love-iap
          ref: ${{ env.LOVE_IAP_REF }}
          path: love-iap

      # Where love's own CI puts them (its main.yml, iOS-Simulator job).
      - name: Place dependencies
        run: |
          mv apple-dependencies/iOS/libraries love/platform/xcode/ios/
          mv apple-dependencies/shared love/platform/xcode/

      # Nothing reads art/ at run time (art/bake.lua bakes it into src/sprites.lua).
      - name: Package game.love
        working-directory: game
        run: |
          zip -9 -r ../love/platform/xcode/ios/game.love main.lua conf.lua src -x '*.DS_Store'
          unzip -l ../love/platform/xcode/ios/game.love | grep -E ' (main|conf)\.lua$'
          ls -lh ../love/platform/xcode/ios/game.love

      - name: Install signing
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$PROFILE_BASE64" ]; then
            echo "::warning::No iOS signing secrets: building an unsigned .ipa only."
            exit 0
          fi
          # A keychain of its own, so the runner's login keychain is never
          # touched and nothing is left behind (Clean up, below).
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpass=$(uuidgen)
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpass" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc"

          # The profile names its team and itself; read both rather than
          # asking for them as two more secrets that could disagree with it.
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          appid=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          [ "$appid" = "$team.$APP_ID" ] || { echo "::error::The provisioning profile is for $appid, not $team.$APP_ID"; exit 1; }
          # Both places: Xcode 16 reads the first, Xcode 26 the second.
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/app.mobileprovision" "$dir/$uuid.mobileprovision"
          done
          echo "Profile \"$name\" ($uuid), team $team"
          {
            echo "IOS_TEAM_ID=$team"
            echo "IOS_PROFILE_NAME=$name"
            echo "KEYCHAIN=$kc"
          } >> "$GITHUB_ENV"

      - name: Configure the Xcode project
        working-directory: love/platform/xcode
        run: |
          sudo gem install --no-document xcodeproj
          cp ../../../love-iap/ios/LoveIap.swift ios/LoveIap.swift
          ruby ../../../game/ios/configure.rb love.xcodeproj ios/game.love ios/LoveIap.swift
          python3 ../../../game/ios/appicon.py "Images.xcassets/iOS AppIcon.appiconset"

          # Info.plist. LÖVE's opens .love files from other apps and shares its
          # Documents folder in Files; a fused game does neither. Metal, not
          # OpenGL ES, is what LÖVE 12 draws with on iOS. Orientations stay
          # LÖVE's (all but upside down on a phone): src/orient.lua's SCREEN
          # row only reaches Android's activity, so iOS turns freely.
          plist=ios/love-ios.plist
          plutil -remove CFBundleDocumentTypes "$plist"
          plutil -remove UTExportedTypeDeclarations "$plist"
          plutil -replace UIFileSharingEnabled -bool NO "$plist"
          plutil -replace CFBundleVersion -string '$(CURRENT_PROJECT_VERSION)' "$plist"
          plutil -replace CFBundleDisplayName -string "$APP_NAME" "$plist"
          plutil -replace UIRequiredDeviceCapabilities -json '["arm64"]' "$plist"
          plutil -replace UIRequiresFullScreen -bool YES "$plist"
          plutil -replace UIStatusBarHidden -bool YES "$plist"
          plutil -replace UIViewControllerBasedStatusBarAppearance -bool NO "$plist"
          # No encryption beyond what iOS itself does (HTTPS, if ever), so
          # App Store Connect stops asking about export compliance per build.
          plutil -replace ITSAppUsesNonExemptEncryption -bool NO "$plist"
          plutil -lint "$plist"

      - name: Build
        working-directory: love/platform/xcode
        run: |
          set -o pipefail
          if [ -n "$IOS_TEAM_ID" ]; then
            sign=()
          else
            sign=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="")
          fi
          # xcbeautify (on the runner image) turns compiler errors into
          # annotations; cat keeps the log readable if an image ever lacks it.
          pretty=cat
          command -v xcbeautify > /dev/null && pretty="xcbeautify --renderer github-actions"
          xcodebuild -project love.xcodeproj -scheme love-ios -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SurviveSchool.xcarchive" \
            "${sign[@]}" archive | $pretty
          app="$RUNNER_TEMP/SurviveSchool.xcarchive/Products/Applications/SurviveSchool.app"
          ls "$app"
          test -f "$app/game.love" || { echo "::error::game.love is not in the app bundle"; exit 1; }
          # iap.lua finds the store through ffi.C: the six functions must have
          # survived stripping (love-iap README, iOS step 3).
          # Listed once to a file: piping nm into grep -q breaks nm's pipe on
          # the first match, which pipefail then reports as a missing symbol.
          nm -gU "$app/SurviveSchool" > "$RUNNER_TEMP/symbols.txt"
          missing=0
          for f in liap_start liap_buy liap_finish liap_restore liap_poll liap_error; do
            grep -q " _$f\$" "$RUNNER_TEMP/symbols.txt" || { echo "::error::$f is not exported"; missing=1; }
          done
          [ "$missing" = 0 ]
          echo "APP=$app" >> "$GITHUB_ENV"
        shell: bash

      # An .ipa is just the .app in a Payload folder, zipped.
      - name: Unsigned .ipa
        run: |
          stage="$RUNNER_TEMP/unsigned"
          mkdir -p "$stage/Payload"
          cp -R "$APP" "$stage/Payload/"
          if [ -n "$IOS_TEAM_ID" ]; then
            # The archive was signed; take that off so this one is honestly
            # unsigned and re-signs cleanly.
            find "$stage/Payload" -name _CodeSignature -type d -prune -exec rm -rf {} +
            rm -f "$stage/Payload/SurviveSchool.app/embedded.mobileprovision"
          fi
          out="$RUNNER_TEMP/$IPA_BASENAME (unsigned).ipa"
          (cd "$stage" && zip -qry "$out" Payload)
          ls -lh "$out"
          echo "IPA_UNSIGNED=$out" >> "$GITHUB_ENV"

      - name: Signed .ipa
        if: env.IOS_TEAM_ID != ''
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          opts="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$opts" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$APP_ID</key><string>$IOS_PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$opts"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SurviveSchool.xcarchive" \
            -exportOptionsPlist "$opts" -exportPath "$RUNNER_TEMP/export"
          out="$RUNNER_TEMP/$IPA_BASENAME.ipa"
          mv "$RUNNER_TEMP/export/"*.ipa "$out"
          ls -lh "$out"
          echo "IPA=$out" >> "$GITHUB_ENV"

          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::notice::No App Store Connect API key: the signed .ipa is not uploaded to TestFlight."
            exit 0
          fi
          # The same export again, sent to App Store Connect instead of
          # written out: it lands in TestFlight once Apple has processed it.
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          plutil -replace destination -string upload "$opts"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SurviveSchool.xcarchive" \
            -exportOptionsPlist "$opts" -exportPath "$RUNNER_TEMP/upload" \
            -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          rm -f "$key"
        shell: bash

      - name: Clean up signing
        if: always() && env.KEYCHAIN != ''
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/app.mobileprovision" "$RUNNER_TEMP/profile.plist"

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_BASENAME }} (iOS, unsigned)
          path: ${{ env.IPA_UNSIGNED }}
          if-no-files-found: error

      - name: Upload signed .ipa
        if: env.IPA != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_BASENAME }} (iOS)
          path: ${{ env.IPA }}
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IPA_UNSIGNED }}
